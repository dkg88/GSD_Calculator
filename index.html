<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone GSD Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 50%, #f3e8ff 100%);
      min-height: 100vh;
    }

    .main-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 1.5rem;
      box-shadow: 
        0 4px 6px -1px rgba(0, 0, 0, 0.05),
        0 10px 15px -3px rgba(0, 0, 0, 0.08),
        0 20px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .section-card {
      background: linear-gradient(145deg, #fafbff 0%, #f8f9fc 100%);
      border: 1px solid #e8ecf4;
      border-radius: 1rem;
      padding: 1.5rem;
      transition: all 0.3s ease;
    }

    .section-card:hover {
      border-color: #d4d9e8;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.08);
    }

    .section-title {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6366f1;
      margin-bottom: 1.25rem;
    }

    .page-title {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
      width: 100%;
      z-index: 50;
      overflow: hidden;
      max-height: 280px;
      overflow-y: auto;
    }

    .dropdown-menu::-webkit-scrollbar {
      width: 6px;
    }

    .dropdown-menu::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 3px;
    }

    .dropdown-menu-open {
      display: block;
      animation: slideDown 0.2s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-option {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.9375rem;
    }

    .dropdown-option:hover {
      background: linear-gradient(90deg, #f0f4ff 0%, #faf5ff 100%);
    }

    .dropdown-option.selected {
      background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
    }

    .dropdown-option svg {
      margin-right: 0.625rem;
    }

    .select-button {
      background: white;
      border: 1.5px solid #e5e7eb;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.9375rem;
      font-weight: 500;
      color: #374151;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .select-button:hover {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .select-button:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .info-field {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.625rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      color: #64748b;
      font-weight: 500;
    }

    .info-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.025em;
      margin-bottom: 0.375rem;
    }

    .input-field {
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 0.875rem 1rem;
      font-size: 1rem;
      font-weight: 500;
      color: #1e293b;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .input-field:hover {
      border-color: #cbd5e1;
    }

    .input-field:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .input-field::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .input-label {
      font-size: 0.9375rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .unit-badge {
      font-size: 0.8125rem;
      font-weight: 500;
      color: #6366f1;
      background: #eef2ff;
      padding: 0.25rem 0.625rem;
      border-radius: 0.375rem;
    }

    .arrow-buttons {
      display: flex;
      align-items: center;
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 0.625rem;
      overflow: hidden;
      margin-left: 0.75rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .arrow-buttons div {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2.25rem;
      cursor: pointer;
      transition: all 0.15s ease;
      color: #64748b;
    }

    .arrow-buttons div:first-child {
      border-right: 1px solid #e2e8f0;
    }

    .arrow-buttons div:hover {
      background: #f1f5f9;
      color: #6366f1;
    }

    .arrow-buttons div:active {
      background: #e2e8f0;
    }

    .arrow-buttons svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.5;
    }

    .toggle-units-button {
      display: inline-flex;
      background: #f1f5f9;
      border-radius: 0.75rem;
      padding: 0.25rem;
      gap: 0.25rem;
    }

    .toggle-units-button div {
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #64748b;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-units-button div:hover:not(.active) {
      color: #475569;
      background: rgba(255, 255, 255, 0.5);
    }

    .toggle-units-button .active {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }

    .reset-button {
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #64748b;
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 0.625rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .reset-button:hover {
      border-color: #f43f5e;
      color: #f43f5e;
      background: #fff1f2;
    }

    .gray-text {
      color: #64748b;
    }

    #result {
      font-size: 1rem;
      font-weight: 500;
      color: #475569;
      padding: 1rem;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfeff 100%);
      border: 1px solid #d1fae5;
      border-radius: 0.75rem;
    }
  </style>
  <script>
    !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="capture identify alias people.set people.set_once set_config register register_once unregister opt_out_capturing has_opted_out_capturing opt_in_capturing reset isFeatureEnabled onFeatureFlags getFeatureFlag getFeatureFlagPayload reloadFeatureFlags group updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures getActiveMatchingSurveys getSurveys getNextSurveyStep onSessionId setPersonProperties".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
    posthog.init('YOUR_PROJECT_API_KEY',{api_host:'https://us.i.posthog.com', person_profiles: 'identified_only'})
  </script>
</head>
<body>
  <div class="container mx-auto px-4 py-8 max-w-3xl">
    <div class="main-card p-8">
      <h1 class="page-title text-center mb-8">Drone GSD Calculator</h1>
      
      <div class="section-card mb-6">
        <h2 class="section-title">Drone & Sensor Selection</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="relative">
            <label for="drone-select-button" class="info-label">Select Drone</label>
            <div class="relative">
              <button id="drone-select-button" class="select-button w-full flex items-center justify-between">
                Select Drone
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </button>
              <div id="drone-select-menu" class="dropdown-menu mt-2"></div>
            </div>
          </div>
          <div class="relative">
            <label for="sensor-select-button" class="info-label">Select Sensor</label>
            <div class="relative">
              <button id="sensor-select-button" class="select-button w-full flex items-center justify-between">
                Select Sensor
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </button>
              <div id="sensor-select-menu" class="dropdown-menu mt-2"></div>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
          <div>
            <label for="image-width" class="info-label">Image Width</label>
            <input type="text" id="image-width" readonly class="info-field w-full">
          </div>
          <div>
            <label for="image-height" class="info-label">Image Height</label>
            <input type="text" id="image-height" readonly class="info-field w-full">
          </div>
          <div>
            <label for="focal-length" class="info-label">Focal Length</label>
            <input type="text" id="focal-length" readonly class="info-field w-full">
          </div>
          <div>
            <label for="sensor-width" class="info-label">Sensor Width</label>
            <input type="text" id="sensor-width" readonly class="info-field w-full">
          </div>
          <div>
            <label for="sensor-height" class="info-label">Sensor Height</label>
            <input type="text" id="sensor-height" readonly class="info-field w-full">
          </div>
          <div>
            <label for="megapixels" class="info-label">Effective Pixels</label>
            <input type="text" id="megapixels" readonly class="info-field w-full">
          </div>
        </div>
      </div>

      <div class="section-card mb-6">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
          <h2 class="section-title mb-0">Flight Parameters</h2>
          <div class="flex items-center gap-3">
            <div class="toggle-units-button">
              <div id="imperial-button" class="active">Imperial</div>
              <div id="metric-button">Metric</div>
            </div>
            <button id="reset-button" class="reset-button">Reset</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="flight-height" class="input-label">Flight Height</label>
            <div class="flex items-center">
              <div class="relative flex-1">
                <input type="text" id="flight-height" class="input-field w-full pr-16" placeholder="Enter height">
                <span class="unit-badge absolute right-3 top-1/2 -translate-y-1/2" id="flight-height-unit">ft</span>
              </div>
              <div class="arrow-buttons">
                <div id="flight-height-up">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>
                </div>
                <div id="flight-height-down">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                </div>
              </div>
            </div>
          </div>
          <div>
            <label for="desired-gsd" class="input-label">Ground Sample Distance</label>
            <div class="flex items-center">
              <div class="relative flex-1">
                <input type="text" id="desired-gsd" class="input-field w-full pr-20" placeholder="Enter GSD">
                <span class="unit-badge absolute right-3 top-1/2 -translate-y-1/2" id="desired-gsd-unit">in/px</span>
              </div>
              <div class="arrow-buttons">
                <div id="desired-gsd-up">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>
                </div>
                <div id="desired-gsd-down">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="result" class="text-center"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
